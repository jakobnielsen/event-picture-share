name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  # ── Job 1: Build & deploy React PWA to GitHub Pages ──────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  # ── Job 2: Push Apps Script code & update deployment ─────────
  deploy-apps-script:
    name: Deploy Apps Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push code
        working-directory: apps-script
        run: clasp push --force

      - name: Create version & update deployment
        working-directory: apps-script
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          clasp deploy --deploymentId "${{ secrets.CLASP_DEPLOYMENT_ID }}" --description "deploy $SHORT_SHA"
